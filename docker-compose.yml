services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - disaster_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: disaster-management-system-web
    restart: unless-stopped
    command: npm run dev
    ports:
      - '3000:3000'
    volumes:
      - ./public/uploads:/app/public/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set to a non-empty value}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3000}
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # Required on macOS — Docker can't receive native filesystem events from the host,
      # so Next.js and Chokidar must poll for file changes instead.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./components
          target: /app/components
        - action: sync
          path: ./context
          target: /app/context
        - action: sync
          path: ./hooks
          target: /app/hooks
        - action: sync
          path: ./lib
          target: /app/lib
        - action: sync
          path: ./prisma
          target: /app/prisma
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./schemas
          target: /app/schemas
        - action: sync
          path: ./middleware.js
          target: /app/middleware.js
        - action: sync
          path: ./server.js
          target: /app/server.js
        - action: sync
          path: ./next.config.js
          target: /app/next.config.js
        - action: sync
          path: ./tailwind.config.js
          target: /app/tailwind.config.js
        - action: sync
          path: ./postcss.config.js
          target: /app/postcss.config.js
        - action: sync
          path: ./jsconfig.json
          target: /app/jsconfig.json
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
    networks:
      - disaster_net

  db_migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: disaster-management-system-web
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set to a non-empty value}
      NODE_ENV: production
    command: sh -c "node node_modules/.bin/prisma db push --accept-data-loss && node prisma/seed.js"
    networks:
      - disaster_net
    restart: "no"

volumes:
  db_data:

networks:
  disaster_net:
    driver: bridge
